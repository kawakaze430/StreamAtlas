name: Verify StreamAtlas prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: npm run doctor
      - run: node --check src/server.js && node --check public/app.js
      - name: Validate shipping Docker configuration
        run: |
          cp deployment/aws/.env.runtime.example deployment/aws/.env.runtime
          docker compose -f deployment/aws/compose.yaml config --quiet --no-interpolate
          docker build -f deployment/aws/Dockerfile -t streamatlas-preview:ci .
      - name: Test pinned optional HLS integration
        run: |
          npm install --no-save --package-lock=false hls.js@1.7.3
          npm run vendor:hls
          test -s public/assets/vendor/hls.min.js
  postgres-and-spring-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamatlas
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: streamatlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: streamatlas
      PGPASSWORD: ci-only-password
      PGDATABASE: streamatlas_ci
      SA_CI_DISPOSABLE_DB: YES
      SA_PG_URL: jdbc:postgresql://127.0.0.1:5432/streamatlas_ci
      SA_PG_USER: streamatlas
      SA_PG_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/ci-postgres-smoke.sh
      - run: mvn --batch-mode -f backend-spring/pom.xml package
      - name: Read-only Spring catalog contract
        shell: bash
        run: |
          java -jar backend-spring/target/*.jar > /tmp/spring.log 2>&1 &
          spring_pid=$!
          trap 'kill "$spring_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS localhost:8080/api/v1/catalog/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS localhost:8080/api/v1/catalog/videos > /tmp/videos.json
          node -e "const d=require('/tmp/videos.json');if(d.total!==72)process.exit(1)"
  private-cdn-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate private-media S3 and CloudFront Terraform without AWS credentials
        run: |
          terraform -chdir=deployment/aws/media-cdn init -backend=false -input=false
          terraform -chdir=deployment/aws/media-cdn validate
