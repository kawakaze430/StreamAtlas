name: StreamAtlas comprehensive CI (main)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamatlas-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  node-regression:
    name: Node regression batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install synthetic media prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run bounded regression batch
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          bash scripts/ci-check.sh "node-batch-$BATCH" bash -c '
            set -euo pipefail
            mapfile -t tests < <(find tests -maxdepth 1 -name "*.test.js" | sort)
            test "${#tests[@]}" -gt 0
            midpoint=$(( (${#tests[@]}+1)/2 ))
            if [[ "$BATCH" == 1 ]]; then
              selected=("${tests[@]:0:midpoint}")
            else
              selected=("${tests[@]:midpoint}")
            fi
            test "${#selected[@]}" -gt 0
            node --version
            exec node --test --test-concurrency=2 "${selected[@]}"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-node-${{ matrix.batch }}
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7

  contracts-and-integrity:
    name: Contracts, committed integrity and test infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: install
      # Verify committed bytes before checks that produce tracked QA reports.
      - name: Verify committed source integrity
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh release-integrity npm run qa:release:verify
      - name: Environment diagnostics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh doctor npm run doctor
      - name: Server syntax
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh syntax-server node --check src/server.js
      - name: Frontend syntax
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh syntax-browser node --check public/app.js
      - name: Strict static HTTP operation inventory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh contracts-static npm run qa:contracts:strict
      - name: Required reviewed dynamic route contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh contracts-dynamic npm run qa:dynamic:strict
      - name: Verify pinned local HLS bytes, notices and registry signature
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh hls-vendor npm run qa:vendor:verify
      - name: Browser and summary failure-reporting regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh python-qa-tests python -m unittest discover -s qa/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-contracts
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7

  postgres:
    name: Disposable loopback PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sa_disposable_ci
          POSTGRES_USER: sa_test
          POSTGRES_PASSWORD: synthetic_ci_password_not_for_live_use
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U sa_test -d sa_disposable_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: sa_test
      PGPASSWORD: synthetic_ci_password_not_for_live_use
      PGDATABASE: sa_disposable_ci
      SA_PG_DISPOSABLE: YES_I_ACCEPT_DATA_LOSS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - name: Guard disposable database and server version
        id: guard
        run: |
          bash scripts/ci-check.sh pg-guard bash -c '
            set -euo pipefail
            test "$PGHOST" = 127.0.0.1
            [[ "$PGDATABASE" == sa_disposable_* ]]
            test "$SA_PG_DISPOSABLE" = YES_I_ACCEPT_DATA_LOSS
            version=$(psql -X -v ON_ERROR_STOP=1 -Atqc "SHOW server_version_num;")
            [[ "$version" -ge 160000 && "$version" -lt 170000 ]]
            psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), current_user;"
          '
      - name: Validate migration structure
        run: bash scripts/ci-check.sh pg-migrations-check node scripts/pg-migrations.js --check
      - name: Apply ordered migrations transactionally
        id: apply
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        run: bash scripts/ci-check.sh pg-apply node scripts/pg-migrations.js --apply
      - name: Verify migration ledger and checksums
        id: verify
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: bash scripts/ci-check.sh pg-verify node scripts/pg-migrations.js --verify
      - name: Concurrent writes and idempotency
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bash scripts/ci-check.sh pg-concurrency node scripts/pg-concurrency-smoke.js
      - name: Reverify ledger after concurrent writes
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bash scripts/ci-check.sh pg-final-verify node scripts/pg-migrations.js --verify
      - name: F03 full-row synthetic SQLite to disposable PostgreSQL catalog parity
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          export DB_PATH="$RUNNER_TEMP/streamatlas-synthetic45.db"
          export PRIVATE_PATH="$RUNNER_TEMP/streamatlas-private45"
          mkdir -p "$RUNNER_TEMP/streamatlas-export45"
          node scripts/export-catalog-pg.js "$RUNNER_TEMP/streamatlas-export45"
          bash scripts/ci-check.sh pg-catalog-full-row-parity node scripts/pg-catalog-import-disposable.js "$RUNNER_TEMP/streamatlas-export45"
          node scripts/pg-migrations.js --verify
      - name: Rehearse and commit generated synthetic accounts into a fresh database
        id: rollback-fixtures
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          SA_PG_ACCOUNT_MIGRATION: YES_SYNTHETIC_ONLY
        run: |
          bash scripts/ci-check.sh pg-synthetic-account-import bash -c '
            set -euo pipefail
            createdb --maintenance-db="$PGDATABASE" sa_disposable_rollback_source_ci
            createdb --maintenance-db="$PGDATABASE" sa_disposable_rollback_target_ci
            export PGDATABASE=sa_disposable_rollback_source_ci
            node scripts/pg-migrations.js --apply
            node scripts/pg-migrations.js --verify
            node scripts/pg-account-migration-disposable.js --rehearse
            SA_MFA_KEY="$(openssl rand -hex 32)"
            export SA_MFA_KEY
            node scripts/pg-account-migration-disposable.js --commit-synthetic
          '
      - name: Restore synthetic checkpoint after a committed disposable fault
        if: ${{ !cancelled() && steps.rollback-fixtures.outcome == 'success' }}
        env:
          PGDATABASE: sa_disposable_rollback_source_ci
          SA_PG_ROLLBACK: YES_SYNTHETIC_ONLY
        run: bash scripts/ci-check.sh pg-checkpoint-rollback node scripts/pg-checkpoint-rollback-disposable.js --target sa_disposable_rollback_target_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-postgres
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7

  spring:
    name: Java 21 Spring controller tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-spring/pom.xml
      - name: Compile and execute real controller tests; reject zero tests
        run: bash scripts/ci-check.sh spring-tests mvn -f backend-spring/pom.xml -B -ntp '-Dtest=*,!SessionAccountPostgresTest,!LibraryPostgresTest,!PreferenceWritePostgresTest' -DfailIfNoTests=true test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-spring
          path: |
            reports/ci/
            backend-spring/target/surefire-reports/*.xml
            backend-spring/target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 7

  spring-account-postgres:
    name: Java 21 accounts, libraries and preferences on disposable PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sa_disposable_spring_account_ci
          POSTGRES_USER: sa_test
          POSTGRES_PASSWORD: synthetic_ci_password_not_for_live_use
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U sa_test -d sa_disposable_spring_account_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: sa_test
      PGPASSWORD: synthetic_ci_password_not_for_live_use
      PGDATABASE: sa_disposable_spring_account_ci
      SA_PG_DISPOSABLE: YES_I_ACCEPT_DATA_LOSS
      SA_TEST_PG: '1'
      SA_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/sa_disposable_spring_account_ci
      SA_TEST_PG_USER: sa_test
      SA_TEST_PG_PASSWORD: synthetic_ci_password_not_for_live_use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-spring/pom.xml
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Guard fresh loopback PostgreSQL 16 for session integration
        id: guard
        run: |
          bash scripts/ci-check.sh spring-pg-guard bash -c '
            set -euo pipefail
            test "$PGHOST" = 127.0.0.1
            [[ "$PGDATABASE" == sa_disposable_* ]]
            test "$SA_PG_DISPOSABLE" = YES_I_ACCEPT_DATA_LOSS
            version=$(psql -X -v ON_ERROR_STOP=1 -Atqc "SHOW server_version_num;")
            [[ "$version" -ge 160000 && "$version" -lt 170000 ]]
            psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), current_user;"
          '
      - name: Apply protected ordered migrations
        id: apply
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        run: bash scripts/ci-check.sh spring-pg-apply node scripts/pg-migrations.js --apply
      - name: Verify migration ledger before session integration
        id: verify
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: bash scripts/ci-check.sh spring-pg-verify node scripts/pg-migrations.js --verify
      - name: Execute actual PostgreSQL account, library and preference tests; reject zero tests
        id: account
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bash scripts/ci-check.sh spring-account-postgres mvn -f backend-spring/pom.xml -B -ntp '-Dtest=SessionAccountPostgresTest,LibraryPostgresTest,PreferenceWritePostgresTest' -DfailIfNoTests=true package
      - name: Compare actual synthetic Node and Spring identity and preference reads
        if: ${{ !cancelled() && steps.account.outcome == 'success' }}
        env:
          SA_PG_URL: jdbc:postgresql://127.0.0.1:5432/sa_disposable_spring_account_ci
          SA_PG_USER: sa_test
          SA_PG_PASSWORD: synthetic_ci_password_not_for_live_use
          SA_SPRING_BIND: 127.0.0.1
          SA_SPRING_PORT: '38081'
          SA_SHADOW_SYNTHETIC_ONLY: 'YES'
          SA_SHADOW_READ_ACK: 'YES'
        run: |
          bash scripts/ci-check.sh spring-node-shadow-parity bash -c '
            set -euo pipefail
            empty_accounts() {
              test "$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT (SELECT count(*) FROM users),(SELECT count(*) FROM sessions),(SELECT count(*) FROM user_preferences),(SELECT count(*) FROM closed_accounts);")" = "0|0|0|0"
            }
            empty_accounts
            java -jar backend-spring/target/streamatlas-catalog-0.9.0-SNAPSHOT.jar > "$RUNNER_TEMP/streamatlas-spring-shadow.log" 2>&1 &
            spring_pid=$!
            cleanup() { kill "$spring_pid" 2>/dev/null || true; wait "$spring_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            ready=0
            for attempt in {1..60}; do
              if ! kill -0 "$spring_pid" 2>/dev/null; then
                printf "%s\n" "Synthetic Spring startup failed; private startup output withheld."
                exit 1
              fi
              if curl --fail --silent --show-error --max-time 1 http://127.0.0.1:38081/api/auth/me > /dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" = 1
            node scripts/test-spring-account-parity-disposable.js --spring http://127.0.0.1:38081 --output reports/qa-spring-node-shadow-parity.json
            empty_accounts
          '
      - name: Reverify protected migration ledger after account fixtures
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bash scripts/ci-check.sh spring-pg-final-verify node scripts/pg-migrations.js --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-spring-postgres
          path: |
            reports/ci/
            reports/qa-spring-node-shadow-parity.json
            backend-spring/target/surefire-reports/*.xml
            backend-spring/target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 7

  browser-network:
    name: Real browser and axe (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser and accessibility dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps '${{ matrix.engine }}'
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false axe-core@4.10.3
      - name: Actual localhost routes, role boundary, keyboard and axe
        env:
          SA_QA_REQUIRE_AXE: '1'
          ENGINE: ${{ matrix.engine }}
        run: bash scripts/ci-check.sh "browser-$ENGINE" python qa/network-e2e.py --engines "$ENGINE" --strict --output "reports/qa-browser-$ENGINE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-browser-${{ matrix.engine }}
          path: |
            reports/ci/
            reports/qa-browser-${{ matrix.engine }}.json
          if-no-files-found: warn
          retention-days: 7

  browser-offline:
    name: Synthetic offline Chromium audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install pinned offline-audit Python browser harness
        run: python -m pip install playwright==1.56.0
      - name: Confirm codec-capable Google Chrome installation
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Offline audit (independent of network engines)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SA_AUDIT_OUTPUT: reports/offline-browser
        run: bash scripts/ci-check.sh browser-offline python scripts/offline-browser-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-offline-browser
          path: |
            reports/ci/
            reports/offline-browser/
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Security and dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: install
      - name: Source security assertions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh security-source npm run qa:security
      - name: Infrastructure policy assertions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh security-infra npm run qa:infra
      - name: Metadata-only SBOM
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh sbom npm run qa:sbom
      - name: Dependency audit (reject high/critical)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh dependency-audit npm audit --omit=dev --audit-level=high
      - name: Audit pinned vendored runtime dependency (reject high/critical)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci-check.sh vendored-dependency-audit npm run qa:vendor:audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-security
          path: |
            reports/ci/
            qa/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 7

  terraform:
    name: Terraform offline validation (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [media-cdn, queue, edge-waf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - name: Init without backend and validate; never plan/apply
        env:
          MODULE: ${{ matrix.module }}
          TF_IN_AUTOMATION: '1'
        run: |
          bash scripts/ci-check.sh "terraform-$MODULE" bash -c '
            set -euo pipefail
            terraform -chdir="deployment/aws/$MODULE" init -backend=false -input=false
            terraform -chdir="deployment/aws/$MODULE" validate
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-terraform-${{ matrix.module }}
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker configuration and build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Compose configuration only
        run: |
          touch deployment/aws/.env.runtime
          bash scripts/ci-check.sh docker-compose docker compose -f deployment/aws/compose.yaml config --quiet --no-interpolate
      - name: Build image without starting services
        if: ${{ !cancelled() }}
        run: bash scripts/ci-check.sh docker-build docker build -f deployment/aws/Dockerfile -t streamatlas-ci:synthetic .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-ci-docker
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7

  evidence:
    name: Exact-commit evidence and incomplete-check summary
    if: always()
    needs: [node-regression, contracts-and-integrity, postgres, spring, spring-account-postgres, browser-network, browser-offline, security, terraform, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact committed tracked source for a private cumulative handoff
        run: |
          git archive --format=tar --prefix=streamatlas-main/ HEAD | gzip -n > streamatlas-main-source.tar.gz
          sha256sum streamatlas-main-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-main-source
          path: streamatlas-main-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: streamatlas-ci-*
          path: reports/downloaded
          merge-multiple: false
      - name: Summarize real exits, counts and NOT RUN checks
        if: ${{ !cancelled() }}
        env:
          SA_CI_JOBS: ${{ toJSON(needs) }}
        run: python scripts/ci-summary.py --reports reports/downloaded --output reports/ci-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamatlas-final-evidence
          path: reports/ci-summary.json
          if-no-files-found: error
          retention-days: 14
