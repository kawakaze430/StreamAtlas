# Private, password-gated single-host evaluation only. Not an age-assurance solution.
name: streamatlas-preview
services:
  app:
    build:
      context: ../..
      dockerfile: deployment/aws/Dockerfile
    image: streamatlas-preview:local
    env_file: .env.runtime
    environment:
      NODE_ENV: production
      SA_PRIVATE_PREVIEW_REQUIRE_RECEIPT: '1'
      SA_REQUIRE_ADMIN_MFA: '1'
      SA_REQUIRE_REVIEWED_LICENSE_EXPIRY: '1'
      PORT: '3000'
      DB_PATH: /app/data/streamatlas.db
      PRIVATE_PATH: /app/data/private
      SA_DISABLE_WORKER: '1'
      TRUST_PROXY: '1'
      SA_PROXY_TRUST_ACK: '1'
    volumes:
      - appdata:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    networks: [appnet]

  worker:
    image: streamatlas-preview:local
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "src/media-worker.js"]
    env_file: .env.runtime
    environment:
      DB_PATH: /app/data/streamatlas.db
      PRIVATE_PATH: /app/data/private
      SA_TRANSCODE_TIMEOUT_MS: '90000'
    volumes:
      - appdata:/app/data
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 768m
    cpus: 1.5
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine
    env_file: .env.runtime
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    depends_on:
      app:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [appnet]

networks:
  appnet: {}
volumes:
  appdata: {}
  caddy_data: {}
  caddy_config: {}
