server.address=${SA_SPRING_BIND:127.0.0.1}
server.port=${SA_SPRING_PORT:8080}
spring.datasource.url=${SA_PG_URL}
spring.datasource.username=${SA_PG_USER}
spring.datasource.password=${SA_PG_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
